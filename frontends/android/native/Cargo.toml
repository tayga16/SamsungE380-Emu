[package]
name = "e830-android-jni"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false
build = "build.rs"

[lib]
name = "e830_android_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
e830 = { package = "samsung-e830-emulator", path = "../../..", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
