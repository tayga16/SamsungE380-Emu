name: Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'frontends/android/**'
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'frontends/android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontends/android/build/cargo-target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('Cargo.lock', 'frontends/android/native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            ndk;29.0.14206865

      - name: Set Android NDK path
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          test -d "$sdk_root/ndk/29.0.14206865"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$sdk_root/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Check Android JNI formatting
        run: cargo fmt --manifest-path frontends/android/native/Cargo.toml -- --check

      - name: Run core tests
        run: cargo test --no-default-features --lib --locked

      - name: Check Android JNI crate
        run: cargo check --locked --manifest-path frontends/android/native/Cargo.toml

      - name: Build and lint APK
        run: ./frontends/android/gradlew -p frontends/android :app:assembleDebug :app:lintDebug

      - name: Write APK checksum
        run: sha256sum frontends/android/app/build/outputs/apk/debug/app-debug.apk > frontends/android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SamsungE380-Android-debug
          path: |
            frontends/android/app/build/outputs/apk/debug/app-debug.apk
            frontends/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
